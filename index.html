<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TEFA ROTI SIP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login">
  <header>
    <h1>TEFA ROTI SIP</h1>
    <p>Sistem Informasi Penjualan dan Pemesanan Roti</p>
  </header>

  <main>
    <section>
      <h2>Login Pengguna</h2>
      <p>Silakan masuk untuk mengakses informasi produk dan layanan TEFA ROTI SIP.</p>
      <form>
        <p>
          <label for="username">Nama Pengguna:</label><br>
          <input type="text" id="username" name="username" placeholder="Masukkan nama pengguna">
        </p>
        <p>
          <label for="password">Kata Sandi:</label><br>
          <input type="password" id="password" name="password" placeholder="Masukkan kata sandi">
        </p>
        <button type="button">Masuk</button>
      </form>
      <p><a href="dashboard.html">Lihat halaman dashboard (contoh)</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 TEFA ROTI SIP. Sistem Informasi Penjualan dan Pemesanan Roti.</p>
  </footer>
</body>
</html>
